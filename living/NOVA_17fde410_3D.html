<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NOVA_17fde410</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Space+Mono&display=swap');
body { margin: 0; overflow: hidden; background: radial-gradient(circle at center, #ffffff 0%, #fffdf5 50%, #fdf4d3 100%); font-family: 'Space Mono', monospace; }
#c { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
#hud { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; text-align: center; background: rgba(255, 255, 255, 0.7); padding: 30px 50px; border: 2px solid #d4af37; border-radius: 12px; backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(212,175,55,0.2); pointer-events: none; }
h1 { font-family: 'Cinzel', serif; color: #b8860b; font-size: 24px; letter-spacing: 4px; margin-bottom: 15px; }
.eq { color: #17becf; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
.hash { color: #666; font-size: 10px; word-break: break-all; }
.status { color: #2e8b57; font-size: 11px; margin-top: 15px; font-weight: bold; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="c"></div>
<div id="hud">
    <h1>L.E.U. NOVA ENTITY</h1>
    <div class="eq">EXIST(x) AND SAY(x) AND MOVE(x) AND DIE(x)</div>
    <div class="hash">SHA-256: 17fde4109c2abc313e499bdafacb91c34b3d17e2fcb20711dcb5b8d47de4f13e</div>
    <div class="status">STATUS: IMMUTABLE & VERIFIABLE</div>
</div>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 50;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0xffffff, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('c').appendChild(renderer.domElement);

// Lumières
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const l1 = new THREE.PointLight(0xd4af37, 2, 200); l1.position.set(20, 20, 20); scene.add(l1);
const l2 = new THREE.PointLight(0x17becf, 1.5, 200); l2.position.set(-20, -20, -20); scene.add(l2);

// Noyau Central (Géométrie Sacrée)
const geo = new THREE.IcosahedronGeometry(10, 1);
const mat = new THREE.MeshBasicMaterial({ color: 0xd4af37, wireframe: true, transparent: true, opacity: 0.6 });
const core = new THREE.Mesh(geo, mat);
scene.add(core);

// Particules (Données)
const particleGeo = new THREE.BufferGeometry();
const pos = new Float32Array(2000 * 3);
for(let i=0; i<pos.length; i+=3) {
    const r = 20 + Math.random() * 30;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);
    pos[i] = r * Math.sin(phi) * Math.cos(theta);
    pos[i+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i+2] = r * Math.cos(phi);
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const particleMat = new THREE.PointsMaterial({ color: 0x17becf, size: 0.5, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// Animation
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    
    core.rotation.x = t * 0.1;
    core.rotation.y = t * 0.15;
    const pulse = 1 + Math.sin(t * 2) * 0.05;
    core.scale.set(pulse, pulse, pulse);
    
    particles.rotation.y = t * 0.05;
    
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
