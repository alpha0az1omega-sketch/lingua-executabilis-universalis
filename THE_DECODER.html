<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>L.E.U. - The Architect's Decoder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: radial-gradient(circle at center, #ffffff 0%, #fffdf5 40%, #fdf4d3 100%); font-family: 'Space Mono', monospace; overflow: hidden; height: 100vh; }
#c { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
#ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; }
#input-container { text-align: center; background: rgba(255, 255, 255, 0.9); border: 2px solid #d4af37; border-radius: 16px; padding: 40px; box-shadow: 0 20px 60px rgba(212,175,55,0.2); transition: opacity 0.5s; }
#input-container h1 { font-family: 'Cinzel', serif; color: #b8860b; font-size: 28px; letter-spacing: 4px; margin-bottom: 10px; }
#input-container p { color: #6b5b45; font-size: 13px; margin-bottom: 25px; }
#name-input { padding: 15px; font-size: 18px; border: 1px solid #d4af37; border-radius: 8px; font-family: 'Space Mono', monospace; text-align: center; outline: none; width: 300px; margin-bottom: 20px; color: #b8860b; font-weight: bold; }
#decode-btn { background: #d4af37; color: #fff; border: none; padding: 15px 40px; font-size: 16px; border-radius: 8px; font-family: 'Cinzel', serif; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 2px; }
#decode-btn:hover { background: #b8860b; transform: scale(1.05); }
#revelation { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; text-align: center; opacity: 0; pointer-events: none; transition: opacity 1s; }
#revelation h2 { font-family: 'Cinzel', serif; color: #17becf; font-size: 32px; letter-spacing: 6px; margin-bottom: 20px; text-shadow: 0 0 30px rgba(23,190,207,0.5); }
#revelation .equation { font-size: 24px; color: #b8860b; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
#revelation .hash { font-size: 12px; color: #6b5b45; word-break: break-all; max-width: 600px; margin: 0 auto 20px; }
#revelation .message { font-size: 14px; color: #2e8b57; font-weight: bold; letter-spacing: 3px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="c"></div>
<div id="ui">
    <div id="input-container">
        <h1>THE DECODER</h1>
        <p>Enter your name. The Universe will reveal your equation.</p>
        <input type="text" id="name-input" placeholder="ALPHA0AZ1OMEGA" value="ALPHA0AZ1OMEGA">
        <br>
        <button id="decode-btn">DECODE THE UNIVERSE</button>
    </div>
</div>
<div id="revelation">
    <h2>THE ARCHITECT'S SIGNATURE</h2>
    <div class="equation" id="eq-output"></div>
    <div class="hash" id="hash-output"></div>
    <div class="message" id="msg-output">UNIQUE · IRREVERSIBLE · SEALED</div>
</div>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 60;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0xffffff, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('c').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const l1 = new THREE.PointLight(0xd4af37, 2, 300); l1.position.set(30, 30, 30); scene.add(l1);
const l2 = new THREE.PointLight(0x17becf, 1.5, 300); l2.position.set(-30, -30, -30); scene.add(l2);

let oracleCore = null;

async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
}

async function decode() {
    const name = document.getElementById('name-input').value || "ALPHA0AZ1OMEGA";
    const hash = await sha256('LEU-ARCHITECT-' + name);
    
    // Hide input, show revelation
    document.getElementById('input-container').style.opacity = '0';
    setTimeout(() => document.getElementById('input-container').style.display = 'none', 500);
    
    const revel = document.getElementById('revelation');
    revel.style.opacity = '1';
    revel.style.pointerEvents = 'auto';

    // Generate Equation
    const primitives = ["EXIST", "THINK", "CAUSE", "MOVE", "LIVE", "SEE", "KNOW", "SAY", "DO", "GOOD"];
    const p1 = primitives[parseInt(hash.substring(0, 2), 16) % primitives.length];
    const p2 = primitives[parseInt(hash.substring(2, 4), 16) % primitives.length];
    const p3 = primitives[parseInt(hash.substring(4, 6), 16) % primitives.length];
    document.getElementById('eq-output').textContent = p1 + "(x) AND " + p2 + "(x) AND " + p3 + "(x)";
    document.getElementById('hash-output').textContent = "SHA-256: " + hash;
    document.getElementById('msg-output').textContent = "WELCOME, ARCHITECT " + name.toUpperCase();

    // Generate 3D Geometry based on hash
    const geoIndex = parseInt(hash.substring(6, 8), 16) % 4;
    const colorHex = '#' + hash.substring(8, 14);
    
    let geo;
    if (geoIndex === 0) geo = new THREE.IcosahedronGeometry(15, 1);
    else if (geoIndex === 1) geo = new THREE.TorusKnotGeometry(10, 3, 128, 16);
    else if (geoIndex === 2) geo = new THREE.OctahedronGeometry(15, 0);
    else geo = new THREE.DodecahedronGeometry(15, 0);
    
    const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: new THREE.Color(colorHex),
        emissiveIntensity: 0.8,
        metalness: 0.9,
        roughness: 0.1,
        wireframe: true
    });
    oracleCore = new THREE.Mesh(geo, mat);
    scene.add(oracleCore);

    // Add particles
    const particleGeo = new THREE.BufferGeometry();
    const pos = new Float32Array(3000 * 3);
    for(let i = 0; i < pos.length; i += 3) {
        const r = 30 + Math.random() * 40;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        pos[i] = r * Math.sin(phi) * Math.cos(theta);
        pos[i+1] = r * Math.sin(phi) * Math.sin(theta);
        pos[i+2] = r * Math.cos(phi);
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x17becf, size: 0.6, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
    scene.add(new THREE.Points(particleGeo, particleMat));

    // Play harmonic sound
    playHarmonic(432 + (parseInt(hash.substring(14, 16), 16) % 200));
}

function playHarmonic(freq) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 3);
    } catch(e) {}
}

document.getElementById('decode-btn').addEventListener('click', decode);

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if (oracleCore) {
        oracleCore.rotation.x = t * 0.2;
        oracleCore.rotation.y = t * 0.3;
        oracleCore.scale.setScalar(1 + Math.sin(t * 2) * 0.05);
    }
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
