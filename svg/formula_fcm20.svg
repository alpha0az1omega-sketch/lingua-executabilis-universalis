<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="400" y="30" font-family="monospace" font-size="16" text-anchor="middle" fill="#222">ALPHA-20 — Formule de Cohérence Multimodale (FCM-20)</text>
  <text x="20" y="90" font-family="monospace" font-size="20" fill="#1f77b4">C(A) = λ · SHA-256(État) + μ · ∫ Son(t) dt + ν · Visuel(A) + ρ · Preuve(A)</text>
  <text x="20" y="140" font-family="monospace" font-size="12" fill="#666">λ, μ, ν, ρ ∈ [0,1] — coefficients de couche L0-L4</text>
  <text x="20" y="170" font-family="monospace" font-size="12" fill="#666">Scellé si C(A) = 1 modulo arrondi cryptographique.</text>
</svg>
